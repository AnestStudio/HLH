<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
  <title>Kênh Chủ Nhà — TrọAwesome</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold mb-1">Kênh Quản Lý Của Chủ Trọ</h1>
      <p class="text-muted small mb-0">Theo dõi lượt xem, quản lý phòng trống và tin nhắn từ khách thuê</p>
    </div>
    <a th:href="@{/owner/create-rental}" class="fa-btn fa-btn-yellow">
      <i class="fa-solid fa-plus"></i> Đăng phòng mới
    </a>
  </div>

  <!-- Host Stats Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="p-3 bg-white border border-3 border-dark rounded-4 shadow-sm">
        <span class="text-muted small fw-bold">Tổng phòng đang đăng</span>
        <h3 class="fw-bold mb-0 mt-1">4 Phòng</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="p-3 bg-white border border-3 border-dark rounded-4 shadow-sm">
        <span class="text-muted small fw-bold">Lượt xem tháng này</span>
        <h3 class="fw-bold mb-0 mt-1 text-success">1,280+</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="p-3 bg-white border border-3 border-dark rounded-4 shadow-sm">
        <span class="text-muted small fw-bold">Yêu cầu liên hệ mới</span>
        <h3 class="fw-bold mb-0 mt-1 text-danger">6 Tin nhắn</h3>
      </div>
    </div>
  </div>

  <!-- Quick Navigation -->
  <div class="d-flex gap-2">
    <a th:href="@{/owner/my-rentals}" class="btn btn-outline-dark fw-bold">
      <i class="fa-solid fa-hotel me-1"></i> Quản lý danh sách phòng
    </a>
    <a th:href="@{/messages/inbox}" class="btn btn-outline-dark fw-bold">
      <i class="fa-solid fa-inbox me-1"></i> Tin nhắn khách thuê
    </a>
  </div>
</main>
</body>
</html>
