<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
  <title>Danh Sách Phòng Trọ</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
  <!-- Breadcrumb & Header -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h3 fw-semibold mb-1">Tìm Kiếm Phòng Trọ Sinh Viên</h1>
      <p class="text-muted small mb-0">Hơn 500+ phòng trọ chính chủ, không qua trung gian</p>
    </div>
    <div class="btn-group border border-2 border-dark rounded-3 overflow-hidden shadow-sm">
      <a th:href="@{/rentals/list}" class="btn btn-warning fw-semibold btn-sm"><i class="fa-solid fa-list me-1"></i> Danh sách</a>
      <a th:href="@{/rentals/map}" class="btn btn-light fw-semibold btn-sm"><i class="fa-solid fa-map-location-dot me-1"></i> Bản đồ Radar</a>
    </div>
  </div>

  <!-- Search Filter Component -->
  <div th:replace="~{fragments/search-filter :: search_filter}"></div>

  <!-- Room Grid -->
  <div class="row g-4">
    <!-- Reusable Rental Card Frag -->
    <th:block th:replace="~{fragments/rental-card :: rental_card}"></th:block>
    <th:block th:replace="~{fragments/rental-card :: rental_card}"></th:block>
    <th:block th:replace="~{fragments/rental-card :: rental_card}"></th:block>
    <th:block th:replace="~{fragments/rental-card :: rental_card}"></th:block>
    <th:block th:replace="~{fragments/rental-card :: rental_card}"></th:block>
    <th:block th:replace="~{fragments/rental-card :: rental_card}"></th:block>
  </div>

  <!-- Reusable Pagination Component -->
  <div th:replace="~{fragments/pagination :: pagination}"></div>
</main>
</body>
</html>
