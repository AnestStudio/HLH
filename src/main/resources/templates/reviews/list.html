<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
  <title>Đánh Giá Nhà Trọ</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-semibold mb-1">Cộng Đồng Đánh Giá Nhà Trọ</h1>
      <p class="text-muted small mb-0">Những nhận xét chân thực từ người thuê giúp bạn tránh bẫy phòng trọ</p>
    </div>
    <a th:href="@{/reviews/create}" class="fa-btn fa-btn-yellow">
      <i class="fa-solid fa-pen-nib"></i> Viết đánh giá
    </a>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="p-4 bg-white border border-3 border-dark rounded-4 shadow-sm h-100">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="badge bg-warning text-dark border border-dark">5.0 <i class="fa-solid fa-star"></i></span>
          <span class="text-muted small">2 ngày trước</span>
        </div>
        <h5 class="fw-semibold mb-1">Khu trọ 165 Cầu Giấy</h5>
        <p class="text-muted small mb-2"><i class="fa-solid fa-location-dot me-1 text-danger"></i>Dịch Vọng, Cầu Giấy</p>
        <p class="text-secondary small leading-relaxed mb-0">
          Chủ nhà cực kỳ dễ tính, tiền điện nước minh bạch theo công tơ riêng từng phòng. Wifi nhanh, ban công thoáng gió.
        </p>
      </div>
    </div>
  </div>
</main>
</body>
</html>
