<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
  <title>Chỉnh Sửa Đánh Giá</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
  <div class="mx-auto" style="max-width: 600px;">
    <div class="p-4 p-md-5 bg-white border border-3 border-dark rounded-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-semibold mb-0">Chỉnh Sửa Đánh Giá</h1>
        <a th:href="@{/account/my-reviews}" class="btn btn-outline-dark btn-sm fw-semibold">Hủy</a>
      </div>

      <form th:action="@{/reviews/edit}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Phòng trọ</label>
          <input type="text" class="form-control border-dark bg-light" value="Phòng khép kín ban công thoáng Cầu Giấy" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Đánh giá chung</label>
          <select name="rating" class="form-select border-dark" required>
            <option value="5" selected>⭐⭐⭐⭐⭐ Tuyệt vời (5/5)</option>
            <option value="4">⭐⭐⭐⭐ Tốt (4/5)</option>
            <option value="3">⭐⭐⭐ Bình thường (3/5)</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Nhận xét chi tiết</label>
          <textarea name="comment" class="form-control border-dark" rows="5" required>Chủ nhà cực kỳ dễ tính, tiền điện nước minh bạch theo công tơ riêng từng phòng. Wifi nhanh, ban công thoáng gió.</textarea>
        </div>
        <button type="submit" class="fa-btn fa-btn-yellow w-100 justify-content-center py-2 mt-2">
          <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
        </button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
