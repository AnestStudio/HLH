<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
  <title>Chi tiết người dùng</title>
</head>
<body>
<main layout:fragment="content" class="container py-5">
  <div class="admin-panel">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-2 border-dark">
      <h2 class="h4 fw-semibold mb-0">Hồ sơ người dùng</h2>
      <a th:href="@{/admin/user}" class="btn btn-outline-dark btn-sm fw-semibold">
        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại danh sách
      </a>
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="p-3 border border-2 border-dark rounded-3 bg-light">
          <span class="text-muted small">Tên đăng nhập:</span>
          <h5 class="fw-semibold mb-0">anhdt</h5>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 border border-2 border-dark rounded-3 bg-light">
          <span class="text-muted small">Họ và tên:</span>
          <h5 class="fw-semibold mb-0">Đinh Tuấn Anh</h5>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 border border-2 border-dark rounded-3 bg-light">
          <span class="text-muted small">Email:</span>
          <h5 class="fw-semibold mb-0">anhdt@gmail.com</h5>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 border border-2 border-dark rounded-3 bg-light">
          <span class="text-muted small">Vai trò:</span>
          <h5 class="fw-semibold mb-0 text-primary">ADMIN</h5>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
