<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title>Quản Lý Người Dùng</title>
</head>
<body>
<main layout:fragment="content" class="container py-5">
    <div class="admin-panel">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-2 border-dark">
            <h2 class="h4 fw-bold mb-0">Danh sách tài khoản hệ thống</h2>
            <span class="admin-badge-role">Quản trị viên</span>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Trạng thái</th>
                        <th class="text-center" style="width: 140px;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><strong>anhdt</strong></td>
                        <td>Đinh Tuấn Anh</td>
                        <td>anhdt@gmail.com</td>
                        <td><span class="badge bg-success">Hoạt động</span></td>
                        <td class="text-center">
                            <a th:href="@{/admin/user/edit(id=1)}" class="btn btn-sm btn-outline-dark me-1" title="Sửa">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteUserModal" title="Xóa">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Slot: Đặt tại root DOM tránh lỗi z-index & backdrop của Bootstrap -->
<th:block layout:fragment="modal">
    <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border border-3 border-dark rounded-4 shadow">
                <div class="modal-header border-bottom border-2 border-dark">
                    <h5 class="modal-title fw-bold" id="deleteUserModalLabel">
                        <i class="fa-solid fa-triangle-exclamation text-danger me-2"></i>Xác nhận xóa tài khoản
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa tài khoản <strong>anhdt</strong>? Thao tác này không thể hoàn tác.
                </div>
                <div class="modal-footer border-top border-2 border-dark">
                    <button type="button" class="btn btn-outline-dark fw-bold" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-danger fw-bold">Xác nhận xóa</button>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
