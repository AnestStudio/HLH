<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
  <title>Chỉnh sửa người dùng</title>
</head>
<body>
<main layout:fragment="content" class="container py-5">
  <div class="admin-panel" style="max-width: 600px; margin: 0 auto;">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-2 border-dark">
      <h2 class="h4 fw-bold mb-0">Chỉnh sửa người dùng</h2>
      <a th:href="@{/admin/user}" class="btn btn-outline-dark btn-sm fw-bold">
        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
      </a>
    </div>
    <form th:action="@{/admin/user/save}" method="post">
      <div class="mb-3">
        <label class="form-label fw-bold small">Tên đăng nhập</label>
        <input type="text" name="username" class="form-control border-dark" value="anhdt" readonly>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Họ và tên</label>
        <input type="text" name="fullName" class="form-control border-dark" value="Đinh Tuấn Anh" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Email</label>
        <input type="email" name="email" class="form-control border-dark" value="anhdt@gmail.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Trạng thái</label>
        <select name="status" class="form-select border-dark">
          <option value="ACTIVE" selected>Hoạt động</option>
          <option value="LOCKED">Tạm khóa</option>
        </select>
      </div>
      <button type="submit" class="fa-btn fa-btn-yellow w-100 justify-content-center mt-3">
        <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
      </button>
    </form>
  </div>
</main>
</body>
</html>
