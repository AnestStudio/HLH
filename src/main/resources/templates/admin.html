<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống — TrọAwesome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark border-bottom border-3 border-dark py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" th:href="@{/}" href="/">
            <i class="fa-solid fa-shield-halved text-warning fs-3"></i>
            <span>TrọAwesome Admin</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white-50" sec:authorize="isAuthenticated()">
                Admin: <strong class="text-white" sec:authentication="name">Admin</strong>
            </span>
            <a th:href="@{/home}" href="/home" class="btn btn-outline-light btn-sm fw-bold">
                <i class="fa-solid fa-house me-1"></i> User Home
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm fw-bold">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="p-5 bg-white border border-3 border-dark rounded-4 shadow-sm">
        <div class="d-flex align-items-center gap-3 mb-4">
            <span class="p-3 bg-warning border border-2 border-dark rounded-3 fs-3">
                <i class="fa-solid fa-gear text-dark"></i>
            </span>
            <div>
                <h1 class="h3 fw-bold mb-1">Bảng điều khiển Quản trị viên</h1>
                <p class="text-muted mb-0">Quản lý người dùng, duyệt tin đăng và kiểm soát dữ liệu phòng trọ.</p>
            </div>
        </div>
        <div class="row g-3">
            <div class="col-md-4">
                <div class="fa-card p-3" style="background: var(--fa-mint);">
                    <div class="fw-bold mb-1"><i class="fa-solid fa-users text-dark me-1"></i> Người dùng</div>
                    <h3 class="fw-bold mb-0">1,420+</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="fa-card p-3" style="background: var(--fa-yellow);">
                    <div class="fw-bold mb-1"><i class="fa-solid fa-hotel text-dark me-1"></i> Phòng đã duyệt</div>
                    <h3 class="fw-bold mb-0">385</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="fa-card p-3" style="background: var(--fa-coral);">
                    <div class="fw-bold mb-1"><i class="fa-solid fa-clock text-dark me-1"></i> Chờ duyệt</div>
                    <h3 class="fw-bold mb-0">14</h3>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
