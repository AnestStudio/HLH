<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
  <title>Cài đặt hệ thống</title>
</head>
<body>
<main layout:fragment="content" class="container py-5">
  <div class="admin-panel" style="max-width: 700px; margin: 0 auto;">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-2 border-dark">
      <h2 class="h4 fw-bold mb-0"><i class="fa-solid fa-sliders me-2"></i>Cấu hình hệ thống</h2>
      <a th:href="@{/admin}" class="btn btn-outline-dark btn-sm fw-bold">
        <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
      </a>
    </div>
    <form th:action="@{/admin/settings}" method="post">
      <div class="mb-3">
        <label class="form-label fw-bold small">Tên ứng dụng</label>
        <input type="text" name="siteName" class="form-control border-dark" value="TrọAwesome">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Email quản trị</label>
        <input type="email" name="adminEmail" class="form-control border-dark" value="admin@troawesome.vn">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Tự động duyệt tin đăng</label>
        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" id="autoApprove">
          <label class="form-check-label small" for="autoApprove">Bật tính năng tự động phê duyệt bài đăng từ chủ trọ uy tín</label>
        </div>
      </div>
      <button type="submit" class="fa-btn fa-btn-yellow mt-3">
        <i class="fa-solid fa-check"></i> Cập nhật cấu hình
      </button>
    </form>
  </div>
</main>
</body>
</html>
