<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ — TrọAwesome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom border-3 border-dark py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/}" href="/">
            <i class="fa-solid fa-house-chimney-window text-warning fs-3"></i>
            <span>TrọAwesome</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold text-muted" sec:authorize="isAuthenticated()">
                Xin chào, <strong class="text-dark" sec:authentication="name">User</strong>
            </span>
            <a th:href="@{/}" href="/" class="btn btn-outline-dark btn-sm fw-bold">
                <i class="fa-solid fa-compass me-1"></i> Khám phá phòng
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm fw-bold">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="p-5 bg-white border border-3 border-dark rounded-4 shadow-sm text-center">
        <div class="mb-3">
            <i class="fa-solid fa-circle-check text-success display-3"></i>
        </div>
        <h1 class="fw-bold mb-3">Đăng nhập thành công!</h1>
        <p class="text-muted fs-5 mb-4">
            Chào mừng bạn đã trở lại hệ thống tìm kiếm phòng trọ sinh viên TrọAwesome.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" href="/" class="fa-btn fa-btn-yellow text-decoration-none">
                <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm phòng trọ ngay
            </a>
            <a th:href="@{/admin}" href="/admin" class="fa-btn fa-btn-navy text-decoration-none" sec:authorize="hasRole('ADMIN')">
                <i class="fa-solid fa-shield-halved"></i> Quản trị hệ thống
            </a>
        </div>
    </div>
</main>
</body>
</html>
