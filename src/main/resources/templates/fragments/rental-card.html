<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Rental Card Fragment</title>
</head>
<body>
  <!-- Rental Card Fragment -->
  <div th:fragment="rental_card" class="col-md-6 col-lg-4">
    <div class="card h-100 border border-3 border-dark rounded-4 shadow-sm overflow-hidden fa-card fa-card-interactive">
      <!-- Thumbnail with badges -->
      <div class="position-relative bg-light" style="height: 200px; overflow: hidden;">
        <img th:src="@{/img/default-room.jpg}" class="w-100 h-100 object-fit-cover" alt="Hình ảnh phòng trọ" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22300%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20300%20200%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cstyle%20type%3D%22text%2Fcss%22%3E%23holder_1%20text%20%7B%20fill%3Argba(0%2C0%2C0%2C.4)%3Bfont-weight%3Abold%3Bfont-family%3AArial%2C%20sans-serif%3Bfont-size%3A18pt%20%7D%20%3C%2Fstyle%3E%3C%2Fdefs%3E%3Cg%20id%3D%22holder_1%22%3E%3Crect%20width%3D%22300%22%20height%3D%22200%22%20fill%3D%22%23ffeaa7%22%3E%3C%2Frect%3E%3Cg%3E%3Ctext%20x%3D%2270%22%20y%3D%22105%22%3EPh%C3%B2ng%20Tr%E1%BB%8D%20M%E1%BA%ABu%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E'">
        <span class="position-absolute top-0 start-0 m-2 badge bg-warning text-dark border border-dark fw-bold">
          <i class="fa-solid fa-bolt me-1"></i>Xác thực 100%
        </span>
        <button type="button" class="btn btn-sm btn-light border border-dark rounded-circle position-absolute top-0 end-0 m-2 shadow-sm" title="Lưu tin yêu thích">
          <i class="fa-regular fa-heart text-danger"></i>
        </button>
      </div>

      <!-- Card Body -->
      <div class="card-body p-3 d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="text-danger fw-bold fs-5">3.2 triệu/tháng</span>
          <span class="badge bg-light text-dark border border-dark">25 m²</span>
        </div>
        <h5 class="card-title fw-bold text-truncate mb-2">
          <a th:href="@{/rentals/detail}" class="text-dark text-decoration-none">Phòng khép kín ban công thoáng Cầu Giấy</a>
        </h5>
        <p class="card-text text-muted small mb-3">
          <i class="fa-solid fa-location-dot me-1 text-danger"></i>Số 18, Ngõ 165 Cầu Giấy, Hà Nội
        </p>

        <div class="mt-auto pt-2 border-top border-2 border-dark d-flex justify-content-between align-items-center">
          <span class="small text-muted"><i class="fa-solid fa-school me-1 text-primary"></i>Gần ĐH Quốc Gia</span>
          <a th:href="@{/rentals/detail}" class="btn btn-sm btn-outline-dark fw-bold">
            Chi tiết <i class="fa-solid fa-arrow-right ms-1"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
