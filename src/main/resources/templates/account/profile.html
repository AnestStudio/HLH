<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
  <title>Tài Khoản Của Tôi</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
  <div class="row g-4">
    <!-- Account Sidebar Menu -->
    <div class="col-md-4 col-lg-3">
      <div class="p-3 bg-white border border-3 border-dark rounded-4 shadow-sm">
        <div class="text-center pb-3 border-bottom border-2 border-dark mb-3">
          <div class="user-avatar-circle bg-warning text-dark mx-auto mb-2" style="width: 60px; height: 60px; font-size: 1.5rem;">A</div>
          <h5 class="fw-semibold mb-0">Đinh Tuấn Anh</h5>
          <span class="text-muted small">anhdt@gmail.com</span>
        </div>
        <div class="nav flex-column nav-pills gap-1">
          <a th:href="@{/account/profile}" class="nav-link active bg-warning text-dark fw-semibold border border-2 border-dark rounded-3">
            <i class="fa-solid fa-user me-2"></i> Hồ sơ cá nhân
          </a>
          <a th:href="@{/account/favorites}" class="nav-link text-dark fw-semibold">
            <i class="fa-solid fa-heart me-2 text-danger"></i> Tin đã lưu
          </a>
          <a th:href="@{/account/my-reviews}" class="nav-link text-dark fw-semibold">
            <i class="fa-solid fa-star me-2 text-warning"></i> Đánh giá của tôi
          </a>
        </div>
      </div>
    </div>

    <!-- Account Details Body -->
    <div class="col-md-8 col-lg-9">
      <div class="p-4 bg-white border border-3 border-dark rounded-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center pb-3 border-bottom border-2 border-dark mb-3">
          <h2 class="h5 fw-semibold mb-0">Thông tin tài khoản</h2>
          <a th:href="@{/account/edit-profile}" class="btn btn-outline-dark btn-sm fw-semibold">
            <i class="fa-solid fa-pen me-1"></i> Chỉnh sửa
          </a>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="text-muted small">Họ và tên</label>
            <div class="fw-semibold fs-6">Đinh Tuấn Anh</div>
          </div>
          <div class="col-md-6">
            <label class="text-muted small">Email</label>
            <div class="fw-semibold fs-6">anhdt@gmail.com</div>
          </div>
          <div class="col-md-6">
            <label class="text-muted small">Số điện thoại</label>
            <div class="fw-semibold fs-6">0912 345 678</div>
          </div>
          <div class="col-md-6">
            <label class="text-muted small">Trường / Nghề nghiệp</label>
            <div class="fw-semibold fs-6">Đại học Bách Khoa Hà Nội</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
