<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
  <title>Đánh Giá Của Tôi</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 fw-bold mb-1">Đánh Giá Bạn Đã Viết</h1>
      <p class="text-muted small mb-0">Quản lý và cập nhật những nhận xét của bạn</p>
    </div>
    <a th:href="@{/account/profile}" class="btn btn-outline-dark btn-sm fw-bold">← Về hồ sơ</a>
  </div>

  <div class="p-4 bg-white border border-3 border-dark rounded-4 shadow-sm mb-3">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <div>
        <h5 class="fw-bold mb-0">Phòng khép kín ban công thoáng Cầu Giấy</h5>
        <span class="text-warning small"><i class="fa-solid fa-star"></i> 5.0 — Tuyệt vời</span>
      </div>
      <div>
        <a th:href="@{/reviews/edit(id=1)}" class="btn btn-sm btn-outline-dark me-1"><i class="fa-solid fa-pen"></i></a>
        <button type="button" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
    <p class="text-muted small mb-0">Chủ nhà cực kỳ dễ tính, tiền điện nước minh bạch theo công tơ riêng từng phòng. Wifi nhanh, ban công thoáng gió.</p>
  </div>
</main>
</body>
</html>
