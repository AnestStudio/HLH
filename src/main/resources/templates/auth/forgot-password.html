<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
  <title>Khôi phục mật khẩu</title>
</head>
<body>
<main layout:fragment="content" class="w-100" style="max-width: 450px;">
  <div class="p-4 p-md-5 bg-white border border-3 border-dark rounded-4 shadow">
    <div class="text-center mb-4">
      <h2 class="h4 fw-bold mb-1">Quên mật khẩu?</h2>
      <p class="text-muted small">Nhập email liên kết với tài khoản của bạn để nhận liên kết đặt lại mật khẩu</p>
    </div>

    <form th:action="@{/forgot-password}" method="post">
      <div class="mb-3">
        <label class="form-label fw-bold small">Địa chỉ email</label>
        <input type="email" name="email" class="form-control border-dark" placeholder="email@example.com" required>
      </div>
      <button type="submit" class="fa-btn fa-btn-yellow w-100 justify-content-center py-2 mt-2">
        <i class="fa-solid fa-paper-plane"></i> Gửi liên kết xác nhận
      </button>
      <div class="text-center mt-3 small">
        <a th:href="@{/login}" class="fw-bold text-dark text-decoration-underline">← Quay lại Đăng nhập</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
