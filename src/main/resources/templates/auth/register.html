<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
  <title>Đăng ký tài khoản</title>
</head>
<body>
<main layout:fragment="content" class="w-100" style="max-width: 450px;">
  <div class="p-4 p-md-5 bg-white border border-3 border-dark rounded-4 shadow">
    <div class="text-center mb-4">
      <h2 class="h4 fw-bold mb-1">Tạo tài khoản mới</h2>
      <p class="text-muted small">Tìm phòng trọ sinh viên tiện lợi và an toàn</p>
    </div>

    <form th:action="@{/register}" method="post">
      <div class="mb-3">
        <label class="form-label fw-bold small">Họ và tên</label>
        <input type="text" name="fullName" class="form-control border-dark" placeholder="Nguyễn Văn A" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Tên đăng nhập</label>
        <input type="text" name="username" class="form-control border-dark" placeholder="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Email</label>
        <input type="email" name="email" class="form-control border-dark" placeholder="email@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">Mật khẩu</label>
        <input type="password" name="password" class="form-control border-dark" placeholder="••••••••" required>
      </div>
      <button type="submit" class="fa-btn fa-btn-yellow w-100 justify-content-center py-2 mt-2">
        <i class="fa-solid fa-user-plus"></i> Đăng ký ngay
      </button>
      <div class="text-center mt-3 small">
        Đã có tài khoản? <a th:href="@{/login}" class="fw-bold text-dark text-decoration-underline">Đăng nhập</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
