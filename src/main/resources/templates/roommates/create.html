<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
  <title>Đăng Tin Tìm Bạn Ở Ghép</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
  <div class="mx-auto" style="max-width: 680px;">
    <div class="p-4 p-md-5 bg-white border border-3 border-dark rounded-4 shadow-sm">
      <h1 class="h4 fw-semibold mb-1">Đăng Tin Tìm Người Ở Ghép</h1>
      <p class="text-muted small mb-4">Mô tả rõ nhu cầu và thói quen để tìm người bạn ở chung hợp ý nhất</p>

      <form th:action="@{/roommates/create}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Tiêu đề tin đăng</label>
          <input type="text" name="title" class="form-control border-dark" placeholder="VD: Tìm 1 bạn nam ở ghép phòng khép kín Bách Khoa" required>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Ngân sách chia sẻ (VNĐ/người/tháng)</label>
            <input type="number" name="budget" class="form-control border-dark" placeholder="VD: 1500000" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Khu vực / Quận</label>
            <select name="district" class="form-select border-dark" required>
              <option value="cau-giay">Quận Cầu Giấy</option>
              <option value="dong-da">Quận Đống Đa</option>
              <option value="hai-ba-trung">Quận Hai Bà Trưng</option>
              <option value="thanh-xuan">Quận Thanh Xuân</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Giới tính bạn cần tìm</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="genderTarget" id="genderMale" value="MALE" checked>
              <label class="form-check-label small" for="genderMale">Nam</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="genderTarget" id="genderFemale" value="FEMALE">
              <label class="form-check-label small" for="genderFemale">Nữ</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="genderTarget" id="genderAny" value="ANY">
              <label class="form-check-label small" for="genderAny">Bất kỳ</label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Thói quen sinh hoạt & Tiêu chí</label>
          <textarea name="habits" class="form-control border-dark" rows="4" placeholder="VD: Không hút thuốc, giữ trật tự sau 23h, dọn phòng luân phiên..."></textarea>
        </div>
        <button type="submit" class="fa-btn fa-btn-yellow w-100 justify-content-center py-2 mt-3">
          <i class="fa-solid fa-paper-plane"></i> Đăng tin tìm bạn ngay
        </button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
