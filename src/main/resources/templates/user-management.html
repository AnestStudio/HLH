<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng — TrọAwesome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark border-bottom border-3 border-dark py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" th:href="@{/admin}" href="/admin">
            <i class="fa-solid fa-shield-halved text-warning fs-3"></i>
            <span>TrọAwesome Admin</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin}" href="/admin" class="btn btn-outline-light btn-sm fw-bold">
                <i class="fa-solid fa-arrow-left me-1"></i> Bảng điều khiển
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm fw-bold">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="p-4 bg-white border border-3 border-dark rounded-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 fw-bold mb-0">Danh sách tài khoản hệ thống</h2>
            <span class="badge bg-warning text-dark border border-dark px-3 py-2">Quản trị viên</span>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><strong>anhdt</strong></td>
                        <td>Đinh Tuấn Anh</td>
                        <td>anhdt@gmail.com</td>
                        <td><span class="badge bg-success">Hoạt động</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
