spring.application.name=HLH

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hlh?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Password12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# SQL logging is enabled only in the "dev" profile (see application-dev.properties)
spring.jpa.show-sql=false

# Hibernate timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh